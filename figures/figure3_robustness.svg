<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440"><rect width="760" height="440" fill="white"/><text x="380" y="28" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold">Hard-overlap result across radius-precision cuts</text><line x1="80" y1="365" x2="710" y2="365" stroke="black"/><line x1="80" y1="55" x2="80" y2="365" stroke="black"/><text x="390" y="425" text-anchor="middle" font-family="sans-serif" font-size="14">Maximum fractional radius uncertainty</text><text x="20" y="215" text-anchor="middle" transform="rotate(-90 20 215)" font-family="sans-serif" font-size="14">Null-adjusted contrast C</text><polyline points="120,235 245,220 370,145 495,125 650,290" fill="none" stroke="black" stroke-width="2"/><g fill="white" stroke="black" stroke-width="2"><circle cx="120" cy="235" r="5"/><circle cx="245" cy="220" r="5"/><circle cx="370" cy="145" r="5"/><circle cx="495" cy="125" r="5"/><circle cx="650" cy="290" r="5"/></g><g font-family="sans-serif" font-size="12" text-anchor="middle"><text x="120" y="390">10%</text><text x="245" y="390">15%</text><text x="370" y="390">20%</text><text x="495" y="390">25%</text><text x="650" y="390">all finite</text><text x="120" y="220">p=.371</text><text x="245" y="205">p=.108</text><text x="370" y="130">p=.0327</text><text x="495" y="110">p=.021</text><text x="650" y="275">p=.127</text></g><text x="215" y="78" font-family="sans-serif" font-size="13">Significance appears only after less-precise radii are admitted, then disappears with no finite cutoff.</text></svg>