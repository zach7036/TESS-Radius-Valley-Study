<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440"><rect width="760" height="440" fill="white"/><text x="380" y="28" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold">Observed size-match rates vs type-stratified null rates</text><line x1="75" y1="365" x2="720" y2="365" stroke="black"/><line x1="75" y1="55" x2="75" y2="365" stroke="black"/><text x="22" y="215" text-anchor="middle" transform="rotate(-90 22 215)" font-family="sans-serif" font-size="14">Fraction within 10% in radius</text><g font-family="sans-serif" font-size="12" text-anchor="middle"><rect x="120" y="287" width="65" height="78" fill="none" stroke="black" stroke-width="2"/><line x1="115" y1="292" x2="190" y2="292" stroke="black" stroke-width="3"/><text x="152" y="282">0.100</text><text x="152" y="388">Nominal valley</text><rect x="270" y="171" width="65" height="194" fill="none" stroke="black" stroke-width="2"/><line x1="265" y1="219" x2="340" y2="219" stroke="black" stroke-width="3"/><text x="302" y="166">0.250</text><text x="302" y="388">Nominal non-valley</text><rect x="430" y="300" width="65" height="65" fill="none" stroke="black" stroke-width="2"/><line x1="425" y1="243" x2="500" y2="243" stroke="black" stroke-width="3"/><text x="462" y="295">0.083</text><text x="462" y="388">Overlap valley</text><rect x="585" y="132" width="65" height="233" fill="none" stroke="black" stroke-width="2"/><line x1="580" y1="207" x2="655" y2="207" stroke="black" stroke-width="3"/><text x="617" y="127">0.300</text><text x="617" y="388">Overlap non-valley</text></g><text x="525" y="70" font-family="sans-serif" font-size="12">box height = observed rate</text><text x="525" y="88" font-family="sans-serif" font-size="12">horizontal mark = random-pair null</text></svg>