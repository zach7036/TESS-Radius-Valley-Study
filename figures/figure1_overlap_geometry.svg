<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440"><rect width="760" height="440" fill="white"/><text x="380" y="28" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold">Hard interval overlap expands the valley window</text><line x1="80" y1="365" x2="710" y2="365" stroke="black"/><line x1="80" y1="55" x2="80" y2="365" stroke="black"/><text x="390" y="425" text-anchor="middle" font-family="sans-serif" font-size="14">Reported radius uncertainty σ (R⊕)</text><text x="20" y="215" text-anchor="middle" transform="rotate(-90 20 215)" font-family="sans-serif" font-size="14">Distance from valley center |r − c| (R⊕)</text><line x1="80" y1="305" x2="710" y2="305" stroke="black" stroke-dasharray="7 5"/><line x1="80" y1="305" x2="710" y2="75" stroke="black" stroke-dasharray="2 5"/><text x="525" y="296" font-family="sans-serif" font-size="13">nominal: |r−c| ≤ w</text><text x="405" y="170" font-family="sans-serif" font-size="13">overlap: |r−c| ≤ w + σ</text><text x="92" y="300" font-family="sans-serif" font-size="12">w = 0.10</text><circle cx="205" cy="280" r="5" fill="white" stroke="black"/><circle cx="255" cy="235" r="5" fill="white" stroke="black"/><circle cx="315" cy="210" r="5" fill="white" stroke="black"/><circle cx="370" cy="185" r="5" fill="white" stroke="black"/><circle cx="430" cy="200" r="5" fill="white" stroke="black"/><text x="485" y="345" font-family="sans-serif" font-size="13">Increasing uncertainty increases the accepted distance from the valley.</text></svg>