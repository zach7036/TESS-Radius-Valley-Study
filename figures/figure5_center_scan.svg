<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440"><rect width="760" height="440" fill="white"/><text x="380" y="28" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold">Center-shift placebo: overlap contrast is broadly positive</text><line x1="80" y1="365" x2="710" y2="365" stroke="black"/><line x1="80" y1="55" x2="80" y2="365" stroke="black"/><line x1="395" y1="55" x2="395" y2="365" stroke="black" stroke-dasharray="3 5"/><text x="390" y="425" text-anchor="middle" font-family="sans-serif" font-size="14">Common shift applied to M/K/G valley centers (R⊕)</text><text x="20" y="215" text-anchor="middle" transform="rotate(-90 20 215)" font-family="sans-serif" font-size="14">Null-adjusted contrast C</text><polyline points="100,255 198,245 297,270 395,310 493,275 592,220 690,335" fill="none" stroke="black" stroke-width="2"/><polyline points="100,315 198,235 297,205 395,170 493,225 592,305 690,265" fill="none" stroke="black" stroke-width="2" stroke-dasharray="8 5"/><g font-family="sans-serif" font-size="12" text-anchor="middle"><text x="100" y="390">−0.6</text><text x="198" y="390">−0.4</text><text x="297" y="390">−0.2</text><text x="395" y="390">0</text><text x="493" y="390">+0.2</text><text x="592" y="390">+0.4</text><text x="690" y="390">+0.6</text></g><text x="545" y="76" font-family="sans-serif" font-size="12">solid = nominal</text><text x="545" y="94" font-family="sans-serif" font-size="12">dashed = 1σ overlap</text><text x="108" y="330" font-family="sans-serif" font-size="12">Published overlap centers are near a local maximum,</text><text x="108" y="348" font-family="sans-serif" font-size="12">but the overlap contrast remains positive across the full ±0.60 R⊕ scan.</text></svg>